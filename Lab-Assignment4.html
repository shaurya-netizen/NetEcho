<!DOCTYPE html>
<html>
<head>
    <title>ShopDynamic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f8;
        }
        .product-card {
            height: 100%;
        }
        .product-card img {
            height: 180px;
            object-fit: cover;
        }
        .cart {
            background-color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .old-price {
            text-decoration: line-through;
            color: gray;
        }

        .discount {
            background-color: green;
            color: white;
            padding: 3px 6px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-light bg-white shadow-sm p-3">
        <div class="container-fluid">
            <h4>🛒 ShopDynamic</h4>
            <span>Home &nbsp; Shop &nbsp; About</span>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-9">
                <div class="row" id="productContainer"></div>
            </div>

            <div class="col-md-3">
                <div class="cart shadow-sm">
                    <h4>Shopping Cart</h4>

                    <div id="cartItems"></div>

                    <hr>

                    <h5>Grand Total: ₹<span id="total">0</span></h5>

                    <button class="btn btn-success w-100 mt-3">
                        Proceed to Checkout
                    </button>
                </div>
            </div>

        </div>
    </div>
    <script>

        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                price: 2499,
                originalPrice: 3499,
                discount: 29,
                description: "Comfortable wireless headphones with clear sound and deep bass.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
                category: "Electronics",
                rating: 4.5,
                inStock: true
            },

            {
                id: 2,
                name: "Smart Watch",
                price: 1999,
                originalPrice: 2999,
                discount: 33,
                description: "A stylish smartwatch for fitness tracking and daily use.",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
                category: "Accessories",
                rating: 4.2,
                inStock: true
            },

            {
                id: 3,
                name: "Running Shoes",
                price: 1799,
                originalPrice: 2499,
                discount: 28,
                description: "Lightweight running shoes designed for comfort and everyday workouts.",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
                category: "Footwear",
                rating: 4.4,
                inStock: true
            },

            {
                id: 4,
                name: "Travel Backpack",
                price: 1299,
                originalPrice: 1999,
                discount: 35,
                description: "A spacious backpack suitable for college, office, and travel.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",
                category: "Bags",
                rating: 4.3,
                inStock: true
            },

            {
                id: 5,
                name: "Digital Camera",
                price: 15999,
                originalPrice: 18999,
                discount: 16,
                description: "Capture memorable moments with a compact digital camera.",
                image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500",
                category: "Electronics",
                rating: 4.6,
                inStock: true
            },

            {
                id: 6,
                name: "Sunglasses",
                price: 899,
                originalPrice: 1499,
                discount: 40,
                description: "Modern sunglasses with a stylish frame for everyday wear.",
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500",
                category: "Fashion",
                rating: 4.1,
                inStock: true
            },

            {
                id: 7,
                name: "Coffee Maker",
                price: 3499,
                originalPrice: 4499,
                discount: 22,
                description: "Prepare fresh coffee at home with this easy-to-use coffee maker.",
                image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500",
                category: "Home Appliances",
                rating: 4.4,
                inStock: false
            }
        ];

        let cart = [];

        function displayProducts() {
            let container = document.getElementById("productContainer");
            for (let i = 0; i < products.length; i++) {
                let p = products[i];
                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card product-card shadow-sm">
                            <img src="${p.image}" class="card-img-top">
                            <div class="card-body">
                                <h5>${p.name} ⭐ ${p.rating}</h5>
                                <p>${p.description}</p>
                                <h6>
                                    ₹${p.price}
                                    <span class="old-price">₹${p.originalPrice}</span>
                                </h6>
                                <span class="discount">${p.discount}% OFF</span>
                                <div class="mt-3">
                                    <button class="btn btn-success w-100"
                                    onclick="addToCart(${p.id})"
                                    ${p.inStock == false ? "disabled" : ""}>
                                    ${p.inStock == true ? "Add to Cart" : "Out of Stock"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function addToCart(id) {
            let product = products[id - 1];
            if (product.inStock == false) {
                alert("Product is out of stock!");
                return;
            }
            let found = false;
            for (let i = 0; i < cart.length; i++) {

                if (cart[i].id == id) {

                    cart[i].quantity++;
                    found = true;

                }
            }

            if (found == false) {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1
                });
            }
            displayCart();
        }
        function displayCart() {
            let cartContainer = document.getElementById("cartItems");
            cartContainer.innerHTML = "";
            let total = 0;
            for (let i = 0; i < cart.length; i++) {
                let item = cart[i];
                let subtotal = item.price * item.quantity;
                total = total + subtotal;
                cartContainer.innerHTML += `
                    <div class="mb-3 border-bottom pb-3">
                        <div class="d-flex">
                            <img src="${item.image}"
                            width="60" height="60"
                            style="object-fit:cover">
                            <div class="ms-2">
                                <h6>${item.name}</h6>
                                <p>₹${item.price}</p>
                            </div>
                        </div>

                        <div class="mt-2">
                            Quantity:
                            <button class="btn btn-sm btn-secondary"
                            onclick="changeQuantity(${item.id}, -1)">
                            -
                            </button>

                            ${item.quantity}

                            <button class="btn btn-sm btn-secondary"
                            onclick="changeQuantity(${item.id}, 1)">
                            +
                            </button>
                        </div>

                        <p class="mt-2">Subtotal: ₹${subtotal}</p>
                    </div>
                `;
            }
            document.getElementById("total").innerHTML = total;
        }

        function changeQuantity(id, change) {
            for (let i = 0; i < cart.length; i++) {
                if (cart[i].id == id) {
                    cart[i].quantity = cart[i].quantity + change;
                    if (cart[i].quantity == 0) {
                        cart.splice(i, 1);
                    }
                    break;
                }
            }
            displayCart();
        }
        displayProducts();

    </script>
</body>
</html>
